name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vp test
      # Cache the VS Code download per release; a new stable gets a new key.
      - id: vscode
        run: echo "version=$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ steps.vscode.outputs.version }}
      - run: xvfb-run -a pnpm test:integration
